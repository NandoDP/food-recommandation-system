version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:14-alpine
    container_name: nutrisenegal-db
    environment:
      POSTGRES_USER: nutrisenegal
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: nutrisenegal_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./script.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nutrisenegal"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nutrisenegal-network

  # FastAPI Backend
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nutrisenegal-api
    environment:
      DATABASE_URL: postgresql://nutrisenegal:${DB_PASSWORD:-changeme}@db:5432/nutrisenegal_db
      SECRET_KEY: ${SECRET_KEY}
      API_BASE_URL: http://localhost:8000
      ENVIRONMENT: production
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./api:/app/api
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - nutrisenegal-network

  # Telegram Bot (optional)
  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: nutrisenegal-bot
    environment:
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}
      # Les routes de l'API sont montées sous /api (voir api/router.py)
      API_BASE_URL: http://api:8000/api
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - nutrisenegal-network

volumes:
  postgres_data:
    driver: local

networks:
  nutrisenegal-network:
    driver: bridge
