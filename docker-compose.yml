services:
  # PostgreSQL Database
  db:
    # n8n 2.x exige PostgreSQL 16 minimum (17 recommandé) pour sa propre base
    image: postgres:17-alpine
    container_name: nutrisenegal-db
    environment:
      POSTGRES_USER: nutrisenegal
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: nutrisenegal_db
    ports:
      # 5433 côté hôte : un PostgreSQL Windows natif occupe déjà 5432 et
      # intercepte les connexions. Les autres conteneurs passent par `db:5432`.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./script.sql:/docker-entrypoint-initdb.d/init.sql
      # Cree la base `n8n` (workflows + credentials) sur un volume neuf
      - ./n8n/init-n8n-db.sql:/docker-entrypoint-initdb.d/00-n8n-db.sql:ro
    healthcheck:
      # -d explicite : sans lui pg_isready vise la base « nutrisenegal », qui
      # n'existe pas, et chaque sonde laisse un FATAL dans les logs
      test: ["CMD-SHELL", "pg_isready -U nutrisenegal -d nutrisenegal_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nutrisenegal-network

  # FastAPI Backend
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nutrisenegal-api
    environment:
      DATABASE_URL: postgresql://nutrisenegal:${DB_PASSWORD:-changeme}@db:5432/nutrisenegal_db
      SECRET_KEY: ${SECRET_KEY}
      API_BASE_URL: http://localhost:8000
      ENVIRONMENT: production
      # Cle partagee avec n8n. Le middleware qui la verifie reste a ecrire
      # (ARCHITECTURE_V2.md §6.2) : la variable est deja en place pour lui.
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY manquant dans .env}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./api:/app/api
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - nutrisenegal-network

  # Telegram Bot (optional)
  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: nutrisenegal-bot
    environment:
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}
      # Les routes de l'API sont montées sous /api (voir api/router.py)
      API_BASE_URL: http://api:8000/api
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - nutrisenegal-network

  # n8n — orchestration conversationnelle (ARCHITECTURE_V2.md §5 et §8)
  # Remplace progressivement le service `bot` : en phase 1 les deux tournent en
  # parallele, n8n sur un second token Telegram de test.
  n8n:
    build:
      context: .
      dockerfile: Dockerfile.n8n
    image: nutrisenegal/n8n:2.39.5-ffmpeg
    container_name: nutrisenegal-n8n
    environment:
      # ---- Persistance : workflows et credentials dans PostgreSQL ----
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: db
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: nutrisenegal
      DB_POSTGRESDB_PASSWORD: ${DB_PASSWORD:-changeme}

      # ---- Chiffrement des credentials ----
      # Sans valeur fixe, n8n en genere une au premier demarrage : la perdre
      # rend TOUS les credentials stockes illisibles. On l'exige explicitement.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY manquant dans .env}

      # ---- Reseau et webhook Telegram ----
      # Telegram exige une URL HTTPS publique : `cloudflared` en dev,
      # reverse proxy TLS en prod (voir n8n/README.md).
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_WEBHOOK_URL: ${PUBLIC_HTTPS_URL:-http://localhost:5678}
      N8N_EDITOR_BASE_URL: ${PUBLIC_HTTPS_URL:-http://localhost:5678}
      N8N_PROXY_HOPS: ${N8N_PROXY_HOPS:-1}
      # L'editeur est servi en HTTP sur localhost : sans ceci le cookie de
      # session est rejete et la connexion echoue.
      N8N_SECURE_COOKIE: "false"

      # ---- Environnement d'execution ----
      GENERIC_TIMEZONE: Africa/Dakar
      TZ: Africa/Dakar
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      # Autorise `{{ $env.GEMINI_LLM_MODEL }}` dans les noeuds : les
      # identifiants de modeles ne sont jamais codes en dur (§4.4).
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"

      # ---- Variables consommees par les workflows via $env ----
      INTERNAL_API_BASE_URL: http://api:8000/api
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY manquant dans .env}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_LLM_MODEL: ${GEMINI_LLM_MODEL:-gemini-3.8-flash}
      GEMINI_ASR_MODEL: ${GEMINI_ASR_MODEL:-gemini-3.5-transcribe}
      GEMINI_TTS_MODEL: ${GEMINI_TTS_MODEL:-gemini-2.5-flash-preview-tts}
      # Phase 1 : second bot de test, l'ancien bot Python garde le token de prod.
      TELEGRAM_TOKEN_N8N: ${TELEGRAM_TOKEN_N8N:-}
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      # Workflows versionnes dans le depot (import/export, voir n8n/README.md)
      - ./n8n/workflows:/workflows
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - nutrisenegal-network

volumes:
  postgres_data:
    driver: local
  n8n_data:
    driver: local

networks:
  nutrisenegal-network:
    driver: bridge
